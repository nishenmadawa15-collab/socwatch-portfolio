<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="SOCWatch — The portfolio that watches you back. A global threat map display.">
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#223047" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#35e0c8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gridMask" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="58%" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gm"><rect width="1200" height="675" fill="url(#gridMask)"/></mask>
    <radialGradient id="globe" cx="42%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#123" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#0d1620" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35e0c8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#35e0c8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8af4e6" stop-opacity="1"/>
    </linearGradient>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDev="6"/>
    </filter>
    <filter id="soft2" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDev="2.2"/>
    </filter>
    <style>
      .mono{font-family:ui-monospace,"Cascadia Code","Consolas",Menlo,monospace;}
      text{fill:#e6edf3;}
      .lat{fill:none;stroke:#223047;stroke-width:1.4;}
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="675" fill="#0a0e14"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.5" mask="url(#gm)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- ===== global threat map (dominant focal) ===== -->
  <g>
    <circle cx="600" cy="348" r="238" fill="#35e0c8" opacity="0.10" filter="url(#soft)"/>
    <circle cx="600" cy="348" r="240" fill="url(#globe)"/>
    <!-- wireframe sphere -->
    <circle cx="600" cy="348" r="240" fill="none" stroke="#2a3b54" stroke-width="2"/>
    <ellipse class="lat" cx="600" cy="348" rx="240" ry="80"/>
    <ellipse class="lat" cx="600" cy="348" rx="240" ry="160"/>
    <ellipse class="lat" cx="600" cy="262" rx="224" ry="48"/>
    <ellipse class="lat" cx="600" cy="434" rx="224" ry="48"/>
    <ellipse class="lat" cx="600" cy="348" rx="80" ry="240"/>
    <ellipse class="lat" cx="600" cy="348" rx="160" ry="240"/>
    <line x1="600" y1="108" x2="600" y2="588" stroke="#223047" stroke-width="1.4"/>

    <!-- attack arcs -->
    <path d="M512 258 Q630 150 714 252" fill="none" stroke="url(#arc)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M500 432 Q540 300 714 252" fill="none" stroke="url(#arc)" stroke-width="2" stroke-linecap="round"/>
    <path d="M512 258 Q470 400 650 470" fill="none" stroke="url(#arc)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

    <!-- nodes -->
    <!-- origin (high / red) with pulse -->
    <circle cx="714" cy="252" r="20" fill="none" stroke="#ff5c7a" stroke-width="1.2" opacity="0.35"/>
    <circle cx="714" cy="252" r="12" fill="none" stroke="#ff5c7a" stroke-width="1.4" opacity="0.6"/>
    <circle cx="714" cy="252" r="5.5" fill="#ff5c7a" filter="url(#soft2)"/>
    <circle cx="714" cy="252" r="4" fill="#ff5c7a"/>
    <!-- warn / amber -->
    <circle cx="500" cy="432" r="10" fill="none" stroke="#ffb454" stroke-width="1.2" opacity="0.5"/>
    <circle cx="500" cy="432" r="4" fill="#ffb454"/>
    <!-- cyan targets -->
    <circle cx="512" cy="258" r="11" fill="none" stroke="#35e0c8" stroke-width="1.2" opacity="0.45"/>
    <circle cx="512" cy="258" r="3.8" fill="#35e0c8"/>
    <circle cx="650" cy="470" r="3.4" fill="#35e0c8"/>
    <circle cx="560" cy="320" r="2.6" fill="#35e0c8" opacity="0.8"/>
    <circle cx="690" cy="392" r="2.6" fill="#35e0c8" opacity="0.8"/>
    <circle cx="470" cy="352" r="2.3" fill="#35e0c8" opacity="0.6"/>
  </g>

  <!-- viewfinder brackets framing the whole cover -->
  <g stroke="#1b8f80" stroke-width="2" fill="none" opacity="0.9">
    <path d="M30 58 V30 H58"/>
    <path d="M1142 30 H1170 V58"/>
    <path d="M30 617 V645 H58"/>
    <path d="M1142 645 H1170 V617"/>
  </g>

  <!-- minimal wordmark (top-left) -->
  <circle cx="58" cy="52" r="10" fill="#35e0c8" opacity="0.5" filter="url(#soft2)"/>
  <circle cx="58" cy="52" r="5.5" fill="#35e0c8"/>
  <text x="78" y="59" class="mono" font-size="22" font-weight="700" letter-spacing="5">SOCWATCH</text>

  <!-- minimal live tag (top-right) -->
  <circle cx="938" cy="52" r="4" fill="#35e0c8"/>
  <text x="1142" y="57" class="mono" font-size="13" letter-spacing="2.5" text-anchor="end" fill="#35e0c8">THREAT MAP // LIVE</text>

  <!-- one-line tagline (bottom-center) -->
  <text x="600" y="646" class="mono" font-size="24" text-anchor="middle" fill="#35e0c8">The portfolio that watches you back.</text>
</svg>
