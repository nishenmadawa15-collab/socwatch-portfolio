<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="SOCWatch — The portfolio that watches you back. A security operations center threat-map display.">
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#223047" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#35e0c8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gridMask" cx="50%" cy="52%" r="72%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gm"><rect width="1200" height="675" fill="url(#gridMask)"/></mask>
    <radialGradient id="scope" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1a22" stop-opacity="1"/>
      <stop offset="78%" stop-color="#0c141c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="sweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35e0c8" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#35e0c8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#35e0c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDev="5"/>
    </filter>
    <filter id="soft2" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDev="2.2"/>
    </filter>
    <style>
      .mono{font-family:ui-monospace,"Cascadia Code","Consolas",Menlo,monospace;}
      text{fill:#e6edf3;}
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="675" fill="#0a0e14"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.5" mask="url(#gm)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- ===== hero threat-map radar (dominant focal) ===== -->
  <g>
    <!-- soft bloom behind scope -->
    <circle cx="600" cy="352" r="250" fill="#35e0c8" opacity="0.10" filter="url(#soft)"/>
    <!-- sonar echo rings -->
    <circle cx="600" cy="352" r="330" fill="none" stroke="#1b8f80" stroke-width="1" opacity="0.10"/>
    <circle cx="600" cy="352" r="296" fill="none" stroke="#1b8f80" stroke-width="1" opacity="0.16"/>
    <!-- scope face -->
    <circle cx="600" cy="352" r="255" fill="url(#scope)"/>
    <circle cx="600" cy="352" r="266" fill="none" stroke="#223047" stroke-width="1" stroke-dasharray="2 14"/>
    <circle cx="600" cy="352" r="255" fill="none" stroke="#2a3b54" stroke-width="2"/>
    <circle cx="600" cy="352" r="190" fill="none" stroke="#223047" stroke-width="1.5"/>
    <circle cx="600" cy="352" r="125" fill="none" stroke="#223047" stroke-width="1.5"/>
    <circle cx="600" cy="352" r="62" fill="none" stroke="#223047" stroke-width="1.5"/>
    <!-- crosshair -->
    <line x1="345" y1="352" x2="855" y2="352" stroke="#223047" stroke-width="1.2"/>
    <line x1="600" y1="97" x2="600" y2="607" stroke="#223047" stroke-width="1.2"/>
    <line x1="420" y1="172" x2="780" y2="532" stroke="#223047" stroke-width="1" opacity="0.6"/>
    <line x1="780" y1="172" x2="420" y2="532" stroke="#223047" stroke-width="1" opacity="0.6"/>

    <!-- sweep wedge -->
    <path d="M600 352 L757 151 A255 255 0 0 0 555.7 100.9 Z" fill="url(#sweep)"/>
    <line x1="600" y1="352" x2="757" y2="151" stroke="#35e0c8" stroke-width="2.6" filter="url(#soft2)"/>
    <line x1="600" y1="352" x2="757" y2="151" stroke="#8af4e6" stroke-width="1.4"/>

    <!-- blips -->
    <!-- high / red, with pulse -->
    <circle cx="679" cy="225" r="22" fill="none" stroke="#ff5c7a" stroke-width="1.2" opacity="0.35"/>
    <circle cx="679" cy="225" r="13" fill="none" stroke="#ff5c7a" stroke-width="1.4" opacity="0.6"/>
    <circle cx="679" cy="225" r="5.5" fill="#ff5c7a" filter="url(#soft2)"/>
    <circle cx="679" cy="225" r="4" fill="#ff5c7a"/>
    <text x="695" y="221" class="mono" font-size="12" fill="#9aa7b8">203.0.113.5</text>
    <!-- warn / amber -->
    <circle cx="491" cy="470" r="10" fill="none" stroke="#ffb454" stroke-width="1.2" opacity="0.5"/>
    <circle cx="491" cy="470" r="4" fill="#ffb454"/>
    <!-- cyan contacts, with pulse on one -->
    <circle cx="685" cy="438" r="12" fill="none" stroke="#35e0c8" stroke-width="1.2" opacity="0.45"/>
    <circle cx="685" cy="438" r="3.6" fill="#35e0c8"/>
    <circle cx="438" cy="268" r="2.8" fill="#35e0c8" opacity="0.85"/>
    <circle cx="628" cy="486" r="2.6" fill="#35e0c8" opacity="0.7"/>
    <circle cx="520" cy="300" r="2.3" fill="#35e0c8" opacity="0.6"/>
    <circle cx="712" cy="330" r="2.3" fill="#35e0c8" opacity="0.6"/>

    <!-- center emitter -->
    <circle cx="600" cy="352" r="14" fill="#35e0c8" opacity="0.35" filter="url(#soft)"/>
    <circle cx="600" cy="352" r="5.5" fill="#35e0c8"/>
  </g>

  <!-- viewfinder brackets framing the whole cover -->
  <g stroke="#1b8f80" stroke-width="2" fill="none" opacity="0.9">
    <path d="M30 58 V30 H58"/>
    <path d="M1142 30 H1170 V58"/>
    <path d="M30 617 V645 H58"/>
    <path d="M1142 645 H1170 V617"/>
  </g>

  <!-- minimal wordmark (top-left) -->
  <circle cx="58" cy="52" r="10" fill="#35e0c8" opacity="0.5" filter="url(#soft2)"/>
  <circle cx="58" cy="52" r="5.5" fill="#35e0c8"/>
  <text x="78" y="59" class="mono" font-size="22" font-weight="700" letter-spacing="5">SOCWATCH</text>

  <!-- minimal live tag (top-right) -->
  <circle cx="950" cy="52" r="4" fill="#35e0c8"/>
  <text x="1142" y="57" class="mono" font-size="13" letter-spacing="2.5" text-anchor="end" fill="#35e0c8">SOC // MONITORING</text>

  <!-- one-line tagline (bottom-center) -->
  <text x="600" y="646" class="mono" font-size="24" text-anchor="middle" fill="#35e0c8">The portfolio that watches you back.</text>
</svg>
