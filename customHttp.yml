# Amplify custom response headers — security posture for SOCWatch.
# Zero inline scripts/styles in the app, so CSP needs no 'unsafe-inline'.
# connect-src gets the Lambda Function URL appended in M4 (backend milestone).
customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:"
      - key: X-Frame-Options
        value: "DENY"
      - key: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - key: X-Content-Type-Options
        value: "nosniff"
      - key: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - key: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - key: Cross-Origin-Opener-Policy
        value: "same-origin"
  # Immutable cache for static assets (fonts/images)
  - pattern: 'assets/**'
    headers:
      - key: Cache-Control
        value: "public, max-age=31536000, immutable"
  # Revalidate the app shell
  - pattern: '*.@(html|css|js)'
    headers:
      - key: Cache-Control
        value: "public, max-age=0, must-revalidate"
